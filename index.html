<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="ちいさな子といっしょに遊べるゲーム集">
<title>こどもゲームズ</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="こどもゲームズ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--navy:#232B4E;--navy2:#2F3864;--deep:#141a35;--paper:#F7F3EA;--mute:#A9B0CF;--yellow:#F4C542;color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:var(--navy);color:var(--paper);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;touch-action:manipulation}
main{max-width:980px;margin:0 auto;padding:32px 16px 48px;box-sizing:border-box}
h1{margin:0;font-size:32px;font-weight:800;line-height:1.2}h1 span{color:var(--yellow)}
header p{margin:6px 0 18px;font-size:14px;color:var(--mute)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:0;padding:0;list-style:none}
.game{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:18px;border-radius:18px;background:var(--paper);color:var(--navy);text-decoration:none;box-shadow:0 6px 0 var(--deep);transition:transform .12s,box-shadow .12s}
.game:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--deep)}
.game:active{transform:translateY(4px);box-shadow:0 2px 0 var(--deep)}
.game:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.icon{font-size:44px;line-height:1;margin-bottom:10px}
.game h3{margin:0;font-size:20px;font-weight:800;line-height:1.3}
.game p{margin:6px 0 14px;font-size:13.5px;line-height:1.5;color:#5A628A;flex:1}
.play{align-self:flex-start;font-weight:800;font-size:14px;padding:6px 14px;border-radius:999px;background:var(--navy);color:var(--yellow)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#232B4E">
</head>
<body>
<main>
  <header>
    <h1>👶 こども<span>ゲームズ</span></h1>
    <p>1〜3さいの子といっしょに。どこをさわっても大丈夫。</p>
  </header>
  <ul class="list">
    <li>
      <a class="game" href="tacchi/">
        <div class="icon" aria-hidden="true">🍎</div>
        <h3>タッチであそぼ</h3>
        <p>1〜3さいの子向けのタッチあそび。りんごが木から落ちる、しゃぼんだまがパチン、たまごから赤ちゃん、おさかな、のりもの、はなび、どうぶつ、おはな、ふうせん、ピアノ、ゆきだるま、もぐもぐ。どこをさわっても大丈夫。</p>
        <span class="play">あそぶ →</span>
      </a>
    </li>
  </ul>
</main>
<script>if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }</script>
</body>
</html>
